abstract:
 es: |
  Estoy diseñando un portfolio basado en mi porfolio visual previamente realizado, con el objetivo de reflejar claramente mi estilo personal y transformarlo en una experiencia visual dinámica, creativa y divertida. Este portfolio está dirigido a posibles empresas interesadas en contratarme y, en un futuro, podría ampliarse incorporando una tienda donde vender prints o merchandising con mis diseños. Además, el formato web se presenta como la mejor forma de darse a conocer en el mundo del diseño y la ilustración, ya que es más accesible y dinámico que una presentación en diapositivas y permite jugar con más elementos que aportan personalidad al trabajo.
 en: |
  I am designing a portfolio based on my previously developed visual portfolio, with the aim of clearly reflecting my personal style and turning it into a dynamic, creative, and engaging visual experience. This portfolio is aimed at potential companies interested in hiring me and could be expanded in the future to include an online shop selling prints or merchandise featuring my designs. In addition, a web-based portfolio is the best way to gain visibility in the world of design and illustration, as it is more accessible and dynamic than a slide presentation and allows for greater creative freedom and personality.

